name: henyardsprintgame
description: "Hen Yard Sprint - Poultry Feed Calculator"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Gray-flow stack.
  webview_flutter: ^4.13.0
  webview_flutter_wkwebview: ^3.25.0
  shared_preferences: ^2.3.2
  appsflyer_sdk: ^6.17.3
  app_tracking_transparency: ^2.0.6
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_app_check: ^0.4.5+2
  # 7.1+ requires Xcode 26.1 for NWPath.isUltraConstrained.
  connectivity_plus: '>=7.0.0 <7.1.0'
  http: ^1.6.0
  # 12.4+ calls an Xcode 26.1-only NSProcessInfo selector.
  device_info_plus: 12.3.0
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/images/
    - assets/Vertical_Notifications_Screen.webp
    - assets/Horizontal_Notifications_Screen.webp
    - assets/Vertical_Nowifi_Screen.webp
    - assets/Horizontal_Nowifi_Screen.webp

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  background_color_ios: "#FFF3D6"
