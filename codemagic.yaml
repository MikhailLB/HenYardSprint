workflows:
  ios-release:
    name: iOS Release → App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: HenYardSprint_ASC    # имя ключа из Codemagic → Integrations → App Store Connect

    environment:
      groups:
        - code-signing                        # группа с CERTIFICATE_PRIVATE_KEY
      flutter: latest
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.henyardsprint.henyardsprintgame
        APP_STORE_APPLE_ID: "YOUR_APPLE_ID"   # числовой Apple ID приложения из App Store Connect

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-white-part
          include: true

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods
        script: pod install
        working_directory: ios

      - name: Code signing & Build IPA
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain add-certificates
          flutter build ios --release --no-codesign
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # поменяй на true только после заполнения Test Information в ASC
        submit_to_app_store: false
